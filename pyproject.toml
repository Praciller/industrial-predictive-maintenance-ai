[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "industrial-predictive-maintenance-ai"
version = "0.1.0"
description = "A reproducible synthetic predictive maintenance portfolio MVP."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[project.scripts]
industrial-pm = "industrial_pm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_pm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
